services:
  student-names-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-names-app:latest
    container_name: student-names-app
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
